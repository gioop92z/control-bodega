<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#122936">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Nova 3.7.0: control de inventario con herramientas administrativas de borrado definitivo.">
  <link rel="manifest" href="manifest.json?v=3.7.0">
  <link rel="icon" href="icon.svg?v=3.4.0" type="image/svg+xml">
  <title>Nova 3.7.0 · Control de Inventario</title>
  <link rel="stylesheet" href="styles.css?v=3.3.0">
  <link rel="stylesheet" href="nova.css?v=3.4.0">
  <link rel="stylesheet" href="nova-assistant.css?v=3.5.1">
  <link rel="stylesheet" href="nova-tutorial-slides.css?v=3.6.0">
  <script>
    try{
      if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.unregister()))).catch(()=>{})}
      if('caches' in window){caches.keys().then(ks=>Promise.all(ks.map(k=>caches.delete(k)))).catch(()=>{})}
      localStorage.removeItem('inv.employee');
      localStorage.removeItem('inv.employeeToken');
      localStorage.removeItem('inv.staff');
    }catch(e){}
  </script>
  <script src="nova-network-guard.js?v=3.5.1"></script>
</head>
<body>
  <div id="app"></div>
  <script src="auto-add.js?v=3.3.0"></script>
  <script type="module" src="app.js?v=3.3.0"></script>
  <script type="module" src="location-scan.js?v=3.3.0-hotfix1"></script>
  <script type="module" src="nova-enhancements.js?v=3.4.0"></script>
  <script type="module" src="nova-admin-welcome.js?v=3.4.1"></script>
  <script type="module" src="nova-assistant-safe.js?v=3.5.1"></script>
  <script type="module" src="nova-tutorial-slides.js?v=3.6.0"></script>
  <script src="nova-danger-zone.js?v=3.7.0-1"></script>
  <script defer src="runtime.js?v=3.3.0"></script>
</body>
</html>
