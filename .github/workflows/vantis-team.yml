name: VANTIS Equipo - contratos y 10000 lecturas
on:
  push:
    branches: [main, 'feat/vantis-equipo-cloudflare-20261109']
    paths:
      - 'cloudflare/**'
      - 'team.html'
      - 'team-config.mjs'
      - 'vantis-team*'
      - 'tests/team-worker.test.mjs'
      - '.github/workflows/vantis-team.yml'
  pull_request:
    paths:
      - 'cloudflare/**'
      - 'team.html'
      - 'team-config.mjs'
      - 'vantis-team*'
      - 'tests/team-worker.test.mjs'
permissions:
  contents: read
jobs:
  sqlite-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxis
        run: |
          bash -n cloudflare/deploy.sh
          node --check cloudflare/worker.mjs
          node --check vantis-team-api.mjs
          node --check vantis-team.mjs
          node --check team-config.mjs
      - name: Probar roles, concurrencia e idempotencia en SQLite
        run: node --test tests/team-worker.test.mjs

      - name: Detect Cloudflare credential readiness without exposing secrets
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VANTIS_AUTH_SECRET: ${{ secrets.VANTIS_AUTH_SECRET }}
          VANTIS_SETUP_KEY: ${{ secrets.VANTIS_SETUP_KEY }}
        run: |
          missing=()
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID VANTIS_AUTH_SECRET VANTIS_SETUP_KEY; do
            if [ -z "${!key}" ]; then missing+=("$key"); fi
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "Cloudflare deployment credentials are available in GitHub Actions." >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::All Cloudflare deployment secrets configured."
          else
            echo "Cloudflare deployment is not authorized: missing GitHub Actions secrets:" >> "$GITHUB_STEP_SUMMARY"
            printf -- '- %s\n' "${missing[@]}" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Cloudflare deployment credentials are incomplete."
          fi
