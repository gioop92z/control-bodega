name: Deploy VANTIS Equipo to Cloudflare
on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - '.github/workflows/deploy-team-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vantis-team-cloudflare-deploy
  cancel-in-progress: false

jobs:
  cloudflare:
    name: Provision D1 and deploy Worker safely
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check deployment configuration
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VANTIS_AUTH_SECRET: ${{ secrets.VANTIS_AUTH_SECRET }}
          VANTIS_SETUP_KEY: ${{ secrets.VANTIS_SETUP_KEY }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$VANTIS_AUTH_SECRET" ] && [ -n "$VANTIS_SETUP_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare deployment skipped: GitHub Actions secrets not configured."
            echo "Cloudflare deployment was not performed: required GitHub Actions secrets are missing." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy Cloudflare D1 and Worker; publish public API URL
        if: steps.secrets.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VANTIS_AUTH_SECRET: ${{ secrets.VANTIS_AUTH_SECRET }}
          VANTIS_SETUP_KEY: ${{ secrets.VANTIS_SETUP_KEY }}
        run: bash cloudflare/deploy.sh
