name: Inspect Supabase RPCs
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspect-supabase.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List public RPC endpoint names
        shell: bash
        run: |
          set -euo pipefail
          API='https://dkqovohxkxlcccvagpij.supabase.co/rest/v1'
          KEY=$(grep "KEY='sb_publishable_" .github/workflows/pages.yml | head -1 | sed -E "s/.*KEY='([^']+)'.*/\1/")
          curl --connect-timeout 5 --max-time 20 -sS "$API/" -H "apikey: $KEY" -H 'Accept: application/openapi+json' > /tmp/openapi.json
          jq -r '.paths | keys[] | select(startswith("/rpc/"))' /tmp/openapi.json | sort
