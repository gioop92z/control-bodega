name: Deploy VANTIS GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: vantis-pages-publication
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and publish static frontend
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout matching commit
        uses: actions/checkout@v4
      - name: Setup Node for non-network syntax checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate public frontend
        run: |
          set -euo pipefail
          node --check app.js
          node --check scanner.js
          node --check catalog-hybrid.mjs
          node --check catalog-visual.mjs
          node --check catalog-relations.mjs
          node --check catalog-runs.mjs
          node --test tests/catalog-runs.test.mjs
          node --check scan-evidence.mjs
          test -s index.html
          test -s app.js
          test -s catalog-hybrid.mjs
          test -s catalog-visual.mjs
          test -s catalog-hybrid.css
          test -s catalog-visual-v53.css
          test -s catalog-runs.css
          grep -Fq 'runSectionHtml()' app.js
          grep -Fq 'catalog-visual-v53.css' index.html
          grep -Fq 'catalog-product-showcase' app.js
      # Database integration and live Supabase API tests run separately in CI.
      # A temporary outage cannot freeze the static frontend on an old release.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Stage tracked site files
        run: |
          mkdir -p "${{ runner.temp }}/vantis-pages"
          git archive HEAD | tar -x -C "${{ runner.temp }}/vantis-pages"
          cat > "${{ runner.temp }}/vantis-pages/deployment-info.json" <<EOF
          {"release":"5.7.0","commit":"${{ github.sha }}","generated_by":"github-actions-pages"}
          EOF
      - name: Upload static frontend
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/vantis-pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
