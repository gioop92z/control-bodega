name: Recover stuck VANTIS Pages deployment
on:
  push:
    paths:
      - '.github/workflows/recover-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  cancel-stale:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel only the stalled 5.8.3 Pages deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          url="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/deployments/4ea2101a36fcdb51e528d9091fd7df8c74be368d"
          status=$(curl -sS -o /tmp/vantis-pages-status.json -w '%{http_code}' -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "${url}")
          echo "Stalled deployment query HTTP ${status}"
          if [[ "${status}" == "404" ]]; then
            echo "The stale deployment is no longer present."
            exit 0
          fi
          [[ "${status}" == "200" ]] || { cat /tmp/vantis-pages-status.json; exit 1; }
          cat /tmp/vantis-pages-status.json
          code=$(curl -sS -X POST -o /tmp/vantis-pages-cancel.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" "${url}/cancel")
          echo "Cancel stalled deployment HTTP ${code}"
          if [[ "${code}" != "204" && "${code}" != "404" ]]; then
            cat /tmp/vantis-pages-cancel.json
            exit 1
          fi
