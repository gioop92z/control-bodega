name: Diagnose public RPC behavior
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/diag-public-rpc.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe RPC responses and schema with fake data only
        shell: bash
        run: |
          set -euo pipefail
          API='https://dkqovohxkxlcccvagpij.supabase.co/rest/v1'
          KEY='sb_publishable_iz06RtaObND0dWOpuX2vKg_wZVbrZCv'
          echo '--- validar_empleado fake ---'
          curl -sS "$API/rpc/validar_empleado" -X POST -H "apikey: $KEY" -H 'Content-Type: application/json' --data '{"p_clave":"__fake__","p_pin":"__fake__"}' | python -c 'import sys,json; x=json.load(sys.stdin); print(x if isinstance(x,dict) else {"rows":len(x)})'
          echo '--- empleados_operativos visible rows ---'
          curl -sS "$API/empleados_operativos?select=*&limit=1" -H "apikey: $KEY" | python -c 'import sys,json; x=json.load(sys.stdin); print({"rows":len(x)} if isinstance(x,list) else x)'
          echo '--- OpenAPI employee schema ---'
          curl -sS "$API/" -H "apikey: $KEY" -H 'Accept: application/openapi+json' > /tmp/openapi.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/openapi.json'))
          defs=d.get('definitions') or d.get('components',{}).get('schemas',{}) or {}
          for name in ['empleados_operativos']:
              s=defs.get(name,{})
              print(name+'_columns='+','.join(sorted((s.get('properties') or {}).keys())))
          for path in ['/rpc/validar_empleado','/rpc/admin_guardar_empleado']:
              p=d.get('paths',{}).get(path,{})
              print(path+'_methods='+','.join(sorted(p.keys())))
              post=p.get('post',{})
              params=post.get('parameters',[])
              names=[]
              for q in params:
                  if q.get('name')=='args':
                      sch=q.get('schema',{})
                      names.extend((sch.get('properties') or {}).keys())
                  elif q.get('name'): names.append(q.get('name'))
              print(path+'_params='+','.join(sorted(set(names))))
          PY
