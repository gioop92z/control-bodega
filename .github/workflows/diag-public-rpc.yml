name: Diagnose public RPC behavior
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/diag-public-rpc.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe RPC responses and schema with fake data only
        shell: bash
        run: |
          set -euo pipefail
          API='https://dkqovohxkxlcccvagpij.supabase.co/rest/v1'
          KEY='sb_publishable_iz06RtaObND0dWOpuX2vKg_wZVbrZCv'
          echo '--- validar_empleado fake ---'
          curl -sS "$API/rpc/validar_empleado" -X POST -H "apikey: $KEY" -H 'Content-Type: application/json' --data '{"p_clave":"__fake__","p_pin":"__fake__"}' | python -c 'import sys,json; x=json.load(sys.stdin); print(x if isinstance(x,dict) else {"rows":len(x)})'
          echo '--- OpenAPI operational schema ---'
          curl -sS "$API/" -H "apikey: $KEY" -H 'Accept: application/openapi+json' > /tmp/openapi.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/openapi.json'))
          defs=d.get('definitions') or d.get('components',{}).get('schemas',{}) or {}
          tables=['departamentos','productos','movimientos','marbetes','producto_marbetes','conteos','conteo_lineas','empleados_operativos','empleado_operativo_departamentos','empleado_sesiones']
          for name in tables:
              s=defs.get(name,{})
              props=s.get('properties') or {}
              print(name+'_columns='+','.join(sorted(props.keys())))
              required=s.get('required') or []
              print(name+'_required='+','.join(sorted(required)))
          paths=d.get('paths',{})
          for path in ['/rpc/validar_empleado','/rpc/admin_guardar_empleado','/rpc/mover_stock_v2','/rpc/importar_catalogo','/rpc/ajuste_fisico_masivo']:
              p=paths.get(path,{})
              print(path+'_methods='+','.join(sorted(p.keys())))
          PY
