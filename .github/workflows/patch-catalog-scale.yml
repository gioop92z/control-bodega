name: Harden VANTIS catalog validation

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply validation hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path("app.js")
          s=p.read_text()

          old="""  const [bySku,byUpc]=await Promise.all([skuReq,upcReq]);
            if (bySku.error) throw bySku.error;
            if (byUpc.error) throw byUpc.error;

            return pickByPriority(bySku.data||[],'sku',skuCandidates)
              || pickByPriority(byUpc.data||[],'upc',upcCandidates)
              || null;"""
          new="""  const [bySku,byUpc]=await Promise.all([skuReq,upcReq]);
            if (bySku.error) throw bySku.error;
            if (byUpc.error) throw byUpc.error;

            const skuRows=bySku.data||[];
            const upcRows=byUpc.data||[];
            const upcSkus=new Set(upcRows.map(x=>String(x.sku||'')).filter(Boolean));
            if (upcSkus.size>1) {
              throw new Error('UPC ambiguo: está relacionado con más de un SKU. Corrige el catálogo antes de continuar.');
            }

            return pickByPriority(skuRows,'sku',skuCandidates)
              || pickByPriority(upcRows,'upc',upcCandidates)
              || null;"""
          if old not in s: raise SystemExit("findProduct block not found")
          s=s.replace(old,new,1)

          old="""async function loadLocations(sku) {
            const r = await sb.from('producto_marbetes').select('marbete_codigo,cantidad,marbetes(zona,descripcion,activo,departamento_id)').eq('sku',sku);
            return (r.data||[])"""
          new="""async function loadLocations(sku) {
            const r = await sb.from('producto_marbetes').select('marbete_codigo,cantidad,marbetes(zona,descripcion,activo,departamento_id)').eq('sku',sku);
            if (r.error) throw r.error;
            return (r.data||[])"""
          if old not in s: raise SystemExit("loadLocations block not found")
          s=s.replace(old,new,1)

          old="""  const mr=await sb.from('marbetes').select('codigo,zona,descripcion,created_at').eq('codigo',code).eq('activo',true).eq('departamento_id',S.deptId).gt('created_at',VISUAL_CLEANUP_CUTOFF).maybeSingle();
            if (!mr.data) { S.searchResult=null; render(); return toast('Código no encontrado.','error'); }
            const pm=await sb.from('producto_marbetes').select('sku,cantidad').eq('marbete_codigo',code);
            const skus=(pm.data||[]).map(x=>x.sku);
            let products=[];
            if (skus.length) {
              const pr=await sb.from('productos').select('sku,upc,descripcion').in('sku',skus);
              products=(pr.data||[]).map(p=>({...p,qty:(pm.data||[]).find(x=>x.sku===p.sku)?.cantidad}));
            }"""
          new="""  const mr=await sb.from('marbetes').select('codigo,zona,descripcion,created_at').eq('codigo',code).eq('activo',true).eq('departamento_id',S.deptId).gt('created_at',VISUAL_CLEANUP_CUTOFF).maybeSingle();
            if (mr.error) throw mr.error;
            if (!mr.data) { S.searchResult=null; render(); return toast('Código no encontrado.','error'); }
            const pm=await sb.from('producto_marbetes').select('sku,cantidad').eq('marbete_codigo',code);
            if (pm.error) throw pm.error;
            const skus=[...new Set((pm.data||[]).map(x=>x.sku).filter(Boolean))];
            let products=[];
            if (skus.length) {
              const pr=await sb.from('productos').select('sku,upc,descripcion').eq('departamento_id',S.deptId).eq('activo',true).in('sku',skus);
              if (pr.error) throw pr.error;
              products=(pr.data||[]).map(p=>({...p,qty:(pm.data||[]).find(x=>x.sku===p.sku)?.cantidad}));
            }"""
          if old not in s: raise SystemExit("marbete block not found")
          s=s.replace(old,new,1)

          old="""  const num=v=>{let x=String(v??'').trim().replace(/[$\\s]/g,'');if(x.includes(',')&&!x.includes('.'))x=x.replace(',','.');else x=x.replace(/,/g,'');const n=Number(x);return Number.isFinite(n)?n:0};
            const bySku=new Map();"""
          new="""  const normalizedNumber=v=>{let x=String(v??'').trim().replace(/[$\\s]/g,'');if(!x)return '';if(x.includes(',')&&!x.includes('.'))x=x.replace(',','.');else x=x.replace(/,/g,'');return x};
            const num=v=>{const x=normalizedNumber(v);if(x==='')return 0;const n=Number(x);return Number.isFinite(n)?n:0};
            const invalidNum=v=>{const x=normalizedNumber(v);return x!==''&&!Number.isFinite(Number(x))};
            const bySku=new Map();"""
          if old not in s: raise SystemExit("numeric parser block not found")
          s=s.replace(old,new,1)

          pattern=r"""(\s+)const upc=normalizeImportCode\(get\(r,'upc'\),\{upc:true\}\);\n\s+const item=\{sku,upc,descripcion:String\(get\(r,'descripcion'\)\)\.trim\(\),marca:String\(get\(r,'marca'\)\)\.trim\(\),talla:String\(get\(r,'talla'\)\)\.trim\(\),color:String\(get\(r,'color'\)\)\.trim\(\),precio:num\(get\(r,'precio'\)\),stock:Math\.round\(num\(get\(r,'stock'\)\)\),minimo:Math\.max\(0,Math\.round\(num\(get\(r,'minimo'\)\)\)\)\};"""
          repl="""    const upc=normalizeImportCode(get(r,'upc'),{upc:true});
    const priceRaw=get(r,'precio'), stockRaw=get(r,'stock'), minRaw=get(r,'minimo');
    const price=num(priceRaw), stock=Math.round(num(stockRaw)), minimo=Math.round(num(minRaw));
    if ((invalidNum(priceRaw)||price<0) && conflicts.length<12) conflicts.push(`SKU ${sku}: precio inválido`);
    if ((invalidNum(stockRaw)||stock<0) && conflicts.length<12) conflicts.push(`SKU ${sku}: stock inválido`);
    if ((invalidNum(minRaw)||minimo<0) && conflicts.length<12) conflicts.push(`SKU ${sku}: mínimo inválido`);
    const item={sku,upc,descripcion:String(get(r,'descripcion')).trim(),marca:String(get(r,'marca')).trim(),talla:String(get(r,'talla')).trim(),color:String(get(r,'color')).trim(),precio:Math.max(0,price),stock:Math.max(0,stock),minimo:Math.max(0,minimo)};"""
          s,n=re.subn(pattern,repl,s,count=1)
          if n!=1: raise SystemExit(f"item validation block not found ({n})")

          p.write_text(s)

          p=Path("vantis-enterprise.js")
          s=p.read_text()
          old="""  const low=(products||[]).filter(p=>Number(p.stock)>0&&Number(p.stock)<=Number(p.stock_minimo||0)).length;
            const last=lastCounts?.[0];"""
          new="""  const low=(products||[]).filter(p=>Number(p.stock)>0&&Number(p.stock)<=Number(p.stock_minimo||0)).length;
            const lowExact=Number(productTotal)<=Number((products||[]).length);
            const lowValue=lowExact?Number(low).toLocaleString('es-MX'):`≥${Number(low).toLocaleString('es-MX')}`;
            const lowSub=lowExact?'Requiere atención':'Mínimo detectado · usa el filtro para el total';
            const last=lastCounts?.[0];"""
          if old not in s: raise SystemExit("low stock calc block not found")
          s=s.replace(old,new,1)
          old="""    metricHtml('Stock bajo',Number(low).toLocaleString('es-MX'),'Requiere atención',low?'attention':'good')+"""
          new="""    metricHtml('Stock bajo',lowValue,lowSub,low?'attention':'good')+"""
          if old not in s: raise SystemExit("low stock metric block not found")
          s=s.replace(old,new,1)
          p.write_text(s)
          PY

      - name: Validate
        shell: bash
        run: |
          node --check app.js
          node --check vantis-enterprise.js
          grep -q "UPC ambiguo" app.js
          grep -q "stock inválido" app.js
          grep -q "lowExact" vantis-enterprise.js
          git diff --check

      - name: Commit
        shell: bash
        run: |
          git config user.name "VANTIS Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app.js vantis-enterprise.js
          git commit -m "Harden catalog validation and large-catalog metrics"
          git push origin HEAD:main
