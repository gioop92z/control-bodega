name: E2E VANTIS seller identity
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'nova.css'
      - 'nova-enhancements.js'
      - 'nova-network-guard.js'
      - 'nova-tutorial-slides.css'
      - 'nova-tutorial-slides.js'
      - 'vantis-enterprise.css'
      - 'vantis-enterprise.js'
      - 'scanner.js'
      - 'product-location.mjs'
      - 'product-location.css'
      - 'vantis-session-gate.js'
      - '.github/workflows/e2e-fake-login.yml'
permissions:
  contents: read
concurrency:
  group: e2e-vantis-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate VANTIS identity, tutorial, seller traceability and navigation
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          cat > e2e-test.mjs <<'JS'
          import { chromium } from 'playwright';
          import { readFileSync } from 'node:fs';

          const EMPLOYEE='472918';
          const expectedIndex=readFileSync('index.html','utf8');
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844}});
          await page.addInitScript(()=>{
            navigator.mediaDevices.getUserMedia=async()=>{throw new DOMException('La prueba usa captura manual.','NotAllowedError')};
          });
          const browserMessages=[];
          let apiHeaders=null;

          page.on('console',msg=>{
            const text=`console:${msg.type()}: ${msg.text()}`;
            browserMessages.push(text);
            console.log(text);
          });
          page.on('pageerror',err=>{
            const text=`pageerror: ${err.message}`;
            browserMessages.push(text);
            console.log(text);
          });
          page.on('request',req=>{
            if(req.url().includes('supabase.co/rest/v1/')){
              const h=req.headers();
              if(h.authorization&&h.apikey) apiHeaders={authorization:h.authorization,apikey:h.apikey,'content-type':'application/json'};
            }
          });

          let ready=false;
          for(let i=0;i<30;i++){
            const url=`https://gioop92z.github.io/control-bodega/?e2e=location-assignment&cb=${Date.now()}-${i}`;
            const response=await page.goto(url,{waitUntil:'domcontentloaded'});
            const html=await response.text();
            console.log(`pages-attempt=${i+1} status=${response?.status()}`);
            if(html===expectedIndex){
              ready=true;
              break;
            }
            await page.waitForTimeout(4000);
          }
          if(!ready) throw new Error('GitHub Pages todavía no sirve la versión del commit probado.');

          await page.locator('#clave').waitFor({state:'visible',timeout:25000});
          await page.waitForTimeout(300);
          if((await page.title())!=='VANTIS · Operación de Inventario') throw new Error('La identidad VANTIS no está activa.');
          if(!(await page.locator('.login-card .eyebrow').innerText()).includes('VANTIS')) throw new Error('El acceso no muestra la identidad VANTIS.');

          await page.locator('#clave').fill('10');
          await page.locator('#clave').dispatchEvent('input');
          await page.locator('#scanEmployeeLogin').waitFor({state:'visible',timeout:5000});
          const pinLabel=await page.locator('#pin').evaluate(el=>el.previousElementSibling?.textContent||'');
          if(!pinLabel.includes('Gafete')) throw new Error('El acceso 10 no cambió a identificación por gafete.');

          await page.locator('#pin').fill(EMPLOYEE);
          await page.locator('button[type=submit]').click();
          await page.locator('#vantisSessionGate [data-vantis-dept]').first().waitFor({state:'visible',timeout:25000});
          await page.locator('#vantisSessionGate [data-vantis-dept]').first().click();
          await page.locator('.access-label').waitFor({state:'visible',timeout:25000});
          await page.waitForTimeout(400);
          const access=await page.locator('.access-label').innerText();
          if(!access.includes('Vendedor general')) throw new Error('No abrió el acceso Vendedor general.');
          await page.locator('.nova-employee-chip').waitFor({state:'visible',timeout:7000});
          if(!(await page.locator('.nova-employee-chip').innerText()).includes(EMPLOYEE)) throw new Error('El número de empleado no aparece en la sesión.');
          if((await page.evaluate(()=>sessionStorage.getItem('nova.employeeNumber')))!==EMPLOYEE) throw new Error('El número de empleado no quedó guardado.');
          if(await page.locator('[data-view="admin"]').count()) throw new Error('El vendedor puede ver Ajustes.');
          if(await page.locator('[data-view="history"]').count()) throw new Error('El vendedor puede ver Historial.');
          if(!(await page.locator('.topbar .eyebrow').innerText()).includes('VANTIS')) throw new Error('El encabezado no fue renombrado a VANTIS.');
          await page.locator('#vantisOverview').waitFor({state:'visible',timeout:7000});

          const navBox=await page.locator('.bottom-nav').boundingBox();
          if(!navBox||navBox.width<100||navBox.height<40) throw new Error('La navegación inferior no está visible.');
          await page.locator('#vantisPosition').waitFor({state:'visible',timeout:5000});

          const guardSource=await page.evaluate(async()=>await (await fetch(`nova-network-guard.js?check=${Date.now()}`)).text());
          if(!guardSource.includes('mover_stock_v2')||!guardSource.includes('TIMEOUT_MS=15000')) throw new Error('No está activo el protector de movimientos.');

          // Tutorial aislado: debe conservar narración, pero con marca VANTIS.
          await page.evaluate(()=>{
            const app=document.getElementById('app');
            const host=document.createElement('div');
            host.id='tutorialE2EHost';
            host.innerHTML='<div class="tabs-row"><button data-atab="departments" class="tabbtn">Departamentos</button><button data-atab="locations" class="tabbtn">Ubicaciones</button><button data-atab="onboarding" class="tabbtn">Guía</button></div><section id="adminBody" class="card"></section>';
            app.appendChild(host);
          });
          await page.waitForTimeout(450);
          if(await page.locator('#tutorialE2EHost [data-atab="onboarding"]').count()) throw new Error('La opción Guía antigua todavía aparece.');
          await page.locator('#tutorialE2EHost #novaTutorialTab').waitFor({state:'attached',timeout:5000});
          await page.waitForTimeout(150);
          if(!(await page.locator('#tutorialE2EHost #novaTutorialTab').innerText()).includes('VANTIS')) throw new Error('El tutorial no usa la marca VANTIS.');
          await page.locator('#tutorialE2EHost #novaTutorialTab').evaluate(el=>el.click());
          await page.locator('#novaSlideStage .nova-slide-card').waitFor({state:'visible',timeout:5000});
          await page.waitForTimeout(150);
          if(!(await page.locator('#novaSlideStage h2').innerText()).includes('VANTIS')) throw new Error('La primera diapositiva no fue renombrada a VANTIS.');
          if(!(await page.locator('#novaTutorialSpeak').innerText()).includes('Escuchar')) throw new Error('El tutorial perdió la narración por voz.');
          if(!(await page.locator('#novaTutorialAuto').innerText()).includes('Reproducir')) throw new Error('El tutorial perdió el recorrido automático.');
          await page.locator('#tutorialE2EHost').evaluate(el=>el.remove());

          // Trazabilidad del vendedor sin tocar inventario real.
          await page.evaluate(()=>{
            const input=document.createElement('input');
            input.id='moveNote';
            input.value='Devolución E2E';
            document.body.appendChild(input);
            const button=document.createElement('button');
            button.id='saveMove';
            button.type='button';
            button.textContent='Guardar E2E';
            document.body.appendChild(button);
          });
          await page.locator('#saveMove').evaluate(el=>el.click());
          const tagged=await page.locator('#moveNote').inputValue();
          if(!tagged.includes(`Empleado ${EMPLOYEE}`)) throw new Error('VANTIS no insertó el número de empleado en la nota.');
          await page.locator('#saveMove').evaluate(el=>el.remove());
          await page.locator('#moveNote').evaluate(el=>el.remove());

          await page.locator('[data-view="search"]').click();
          await page.locator('#manualSearch').waitFor({state:'visible',timeout:10000});
          await page.locator('#searchCode').fill('__e2e_no_product__');
          await page.locator('#manualSearch button').click();
          await page.waitForTimeout(1000);
          if(!apiHeaders) throw new Error('No se capturó una sesión autenticada de Supabase.');

          // Browser integration with a synthetic location. All assignment
          // writes below are intercepted; no operational records are changed.
          const dept=await page.evaluate(()=>localStorage.getItem('inv.dept'));
          const catalog=await page.context().request.get(`https://dkqovohxkxlcccvagpij.supabase.co/rest/v1/productos?select=id,sku,stock&departamento_id=eq.${dept}&activo=eq.true&limit=1`,{headers:apiHeaders});
          if(!catalog.ok())throw new Error('No se pudo leer un artículo para verificar la búsqueda.');
          const product=(await catalog.json())[0];
          if(!product)throw new Error('El departamento de prueba no tiene artículos activos.');
          const label='VANTIS-E2E-LOCATION';
          const fakeLabel={codigo:label,zona:'BODEGA',descripcion:'Prueba aislada',activo:true,departamento_id:dept};
          const fakeAssignment={sku:product.sku,marbete_codigo:label,cantidad:null};
          let assigned=false,assignmentWrites=0;
          await page.route('**/rest/v1/marbetes?**',async route=>{
            const url=new URL(route.request().url());
            if(url.searchParams.get('codigo')!==`eq.${label}`)return route.continue();
            if(route.request().method()!=='GET')throw new Error('Intento inesperado de modificar marbetes.');
            return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify([fakeLabel])});
          });
          await page.route('**/rest/v1/producto_marbetes**',async route=>{
            const request=route.request(),url=new URL(request.url());
            if(request.method()==='POST'){
              const payload=request.postDataJSON();
              if(payload.sku!==product.sku||payload.marbete_codigo!==label||payload.cantidad!==null)throw new Error('La asignación no corresponde al artículo confirmado.');
              if(!(request.headers().prefer||'').includes('resolution=ignore-duplicates'))throw new Error('El guardado no conserva asignaciones existentes.');
              assigned=true;assignmentWrites++;
              return route.fulfill({status:201,contentType:'application/json',body:'[]'});
            }
            if(request.method()!=='GET')throw new Error('Intento inesperado de modificar asignaciones.');
            if(url.searchParams.get('sku')!==`eq.${product.sku}`)return route.continue();
            if(url.searchParams.get('marbete_codigo')===`eq.${label}`)return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(assigned?[fakeAssignment]:[])});
            if(!assigned)return route.continue();
            const original=await route.fetch(),rows=await original.json();
            return route.fulfill({response:original,json:[...rows,{...fakeAssignment,marbetes:fakeLabel}]});
          });
          await page.locator('#searchCode').fill(product.sku);
          await page.locator('#manualSearch button').click();
          await page.locator('#giveProductLocation').waitFor({state:'visible',timeout:20000});
          await page.locator('#giveProductLocation').click();
          await page.locator('#productMarbeteCode').fill(label);
          await page.locator('#manualProductMarbete button').click();
          await page.locator('#confirmProductLocation').waitFor({state:'visible',timeout:15000});
          await page.locator('#confirmProductLocation').click();
          await page.getByText('Ubicación guardada:',{exact:false}).first().waitFor({state:'visible',timeout:20000});
          if(assignmentWrites!==1)throw new Error('El flujo realizó más de una escritura.');
          const stock=await page.locator('.stock-big').innerText();
          if(!stock.trim().startsWith(String(product.stock)))throw new Error('La asignación cambió el stock mostrado.');
          if(!(await page.locator('.loc-list').innerText()).includes(label))throw new Error('La ubicación guardada no apareció en la ficha.');
          const overflow=await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth+1);
          if(overflow)throw new Error('El flujo de ubicación desborda la pantalla de celular.');

          const probe=await page.context().request.post('https://dkqovohxkxlcccvagpij.supabase.co/rest/v1/rpc/mover_stock_v2',{
            headers:apiHeaders,
            data:{p_token:null,p_id:'00000000-0000-0000-0000-000000000001',p_producto:'00000000-0000-0000-0000-000000000000',p_tipo:'ENTRADA',p_cantidad:1,p_marbete:null,p_nota:`Empleado ${EMPLOYEE} · E2E SIN CAMBIOS`}
          });
          const probeText=await probe.text();
          console.log(`movement-probe-status=${probe.status()} body=${probeText.slice(0,500)}`);
          if(/sesión operativa|session.*oper|token.*(invál|inval|requer|required)|permission denied|not authorized/i.test(probeText)) throw new Error('El backend exige el sistema antiguo de empleados.');
          if(browserMessages.some(x=>/pageerror:/i.test(x))) throw new Error(`Errores JS en navegador: ${browserMessages.join(' | ')}`);
          console.log('E2E VANTIS location assignment, identity and navigation OK');
          await browser.close();
          JS
          node e2e-test.mjs
