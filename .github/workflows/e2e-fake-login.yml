name: E2E fake employee login
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/e2e-fake-login.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test login path with fake PIN only
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          cat > e2e-test.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage();
          await page.goto('https://gioop92z.github.io/control-bodega/?e2e=1',{waitUntil:'networkidle'});
          await page.locator('#clave').fill('10');
          await page.locator('#pin').fill('00000000');
          await page.locator('button[type=submit]').click();
          await page.waitForTimeout(2500);
          const text=await page.locator('#loginMsg').innerText().catch(()=> '');
          console.log('message='+text.replace(/\s+/g,' ').trim());
          if(text.includes('sesión operativa')) process.exit(2);
          if(!text.includes('sincronizada')&&!text.includes('incorrect')) process.exit(3);
          await browser.close();
          JS
          node e2e-test.mjs
